version: "3.8"

services:
  cocktail-app:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: never
    container_name: cocktail-app
    ports:
      - "${APP_PUBLISH_PORT:-5000}:5000"
    volumes:
      - ${DATA_HOST_DIR:-cocktail_data}:/data
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      USER_USERNAME: ${USER_USERNAME:-user}
      USER_PASSWORD: ${USER_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/cocktails.db}
      UPLOAD_FOLDER: ${UPLOAD_FOLDER:-/data/uploads}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cocktail_net

volumes:
  cocktail_data:

networks:
  cocktail_net:
    external: true
