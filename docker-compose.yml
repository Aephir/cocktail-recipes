version: "3.8"

services:
  cocktail-app:
    build:
      context: https://github.com/Aephir/cocktail-recipes.git
      dockerfile: Dockerfile
    container_name: cocktail-app
    ports:
      - "5000:5000"
    volumes:
      - /mnt/storage_1/docker/cocktail_recipes:/data
    environment:
      SECRET_KEY: "change-this-to-a-long-random-string-before-deploying"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "change-this-admin-password"
      USER_USERNAME: "guest"
      USER_PASSWORD: "change-this-user-password"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  cocktail_data:
    driver: local
